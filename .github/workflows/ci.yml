# CI workflow for Coral itself
name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - '**.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'sandbox/**'
      - 'action.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.rs'
      - '**.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - 'sandbox/**'
      - 'action.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  ui:
    name: UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test graph interactions
        run: npm test

      - name: Build (Static Mode)
        run: npm run build:static

      - name: Upload UI Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  action-test:
    name: GitHub Action Test
    runs-on: ubuntu-latest
    needs: [rust, ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Test Action (JSON only)
        id: json-test
        uses: ./
        with:
          proto-path: 'sandbox'

      - name: Verify JSON output
        run: |
          echo "=== JSON path ==="
          echo "coral-output/graph.json"
          echo ""
          echo "=== JSON (first 30 lines) ==="
          head -30 coral-output/graph.json

      - name: Test Action (with Pages)
        id: pages-test
        uses: ./
        with:
          proto-path: 'sandbox'
          generate-pages: 'true'

      - name: Verify Pages output
        run: |
          echo "=== Pages files ==="
          ls -la coral-output/html/
          test -f coral-output/html/index.html
          echo "index.html exists"
          test -f coral-output/html/graph.json
          echo "graph.json exists"

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: coral-output/html

  deploy-pages:
    name: Deploy to GitHub Pages
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: action-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 180000
