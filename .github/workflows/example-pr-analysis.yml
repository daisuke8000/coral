# Example: Analyze proto dependencies on Pull Request
# Copy this file to your project's .github/workflows/ directory

name: Proto Dependency Analysis

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Analyze Proto Dependencies
        uses: daisuke8000/coral@v0.2.2
        with:
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
