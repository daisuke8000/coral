# Example: Analyze proto dependencies on Pull Request
# Copy this file to your project's .github/workflows/ directory

name: Proto Dependency Analysis

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Analyze Proto Dependencies
        uses: daisuke8000/coral@v0.2.2
        with:
          comment-on-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
