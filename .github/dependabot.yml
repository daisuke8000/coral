version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    # Current typescript-eslint supports TS <6.1; revisit when TS 7 is supported.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0 <8.0.0"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
